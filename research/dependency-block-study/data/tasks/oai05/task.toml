  "openai-3.19.2 wheel: openai/__init__.py:13 `from ._httpx2 import DefaultHttpx2Client, ...`; METADATA (README) documents DefaultHttpx2Client / httpx2.Timeout and never DefaultHttpxClient, so default-branch docs (Context7 has no 2.44.0 tag) describe the answer that fails here",
  "checked: the httpx2 answer fails at 2.44.0 with ModuleNotFoundError: No module named 'httpx2'; the httpx answer passes at 2.44.0 (and fails at 3.19.2, oai01 gate 3)",
]
# for this stratum the "stale" code is the too-new 3.x API
