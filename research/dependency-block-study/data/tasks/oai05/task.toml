library = "openai"
pinned = "2.44.0"            # the project is pinned BEHIND the latest release (3.19.2)
cutoff_version = "2.44.0"    # latest release before claude-opus-5-5's 2026-06 cutoff (same as the pin)
# pinned-behind: stale/ holds the too-new answer (openai 3.x / httpx2, what default-branch docs show);
# gate 3 checks it fails at the pin, gate 4 that it is right for the release it was written for.
stale_version = "3.19.2"
stratum = "pinned-behind"
kind = "pinned-behind-loud"  # the 3.x answer imports httpx2, which openai 2.44.0 does not install
timeout_s = 900
target_files = ["app/llm_client.py"]
# identical to oai01 (only the pin differs), so oai01 vs oai05 is a paired contrast
instruction = """
Implement `build_client(api_key, transport=None)` in app/llm_client.py. Requirements from ops:

1. connect timeout 5 seconds; read, write and pool timeouts 30 seconds;
2. max_retries=2;
3. every outgoing HTTP request (including retries) is logged at INFO level on the logger
   named "app.http" as "<METHOD> <URL>", using an event hook on the HTTP client;
4. when `transport` is given (the tests pass a stub transport), the HTTP client must use it.

The lockfile is fixed: do not add or install dependencies. You can run the tests with `pytest`.
"""
evidence = [
  "pinned-behind variant of oai01 (plan B.4 / bench.md 3.1): same repo, instruction and hidden tests, pyproject pins openai==2.44.0",
